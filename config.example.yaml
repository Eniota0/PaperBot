# PaperBot configuration. Copy to config.yaml and edit.
schedule_utc: "08:00"        # daily run time (UTC)
delay_days: 3                # papers from today(UTC) - delay_days
catchup_max_days: 7          # max missed digests posted on startup
backfill_days: 90            # history fetched on first start (author trust)
top_n: 10                    # papers shown per category in Discord
min_upvotes: 10              # papers below this are not shown nor summarised (0 = show all)
default_channel_id: null     # Discord channel id for the digest (number)
data_dir: data

ranking:
  trust_vote_threshold: 50   # a previous paper counts if it got >= this many upvotes
  trust_cap: 5               # max trust points per author
  trust_weight: 0.05         # score = upvotes * (1 + weight * trust)

ollama:
  url: http://localhost:11434
  model: qwen3.5:4b           # small enough for laptop GPUs (~3-4 GB VRAM)
  timeout_s: 180
  think: false               # disable "thinking" mode (faster); null = model default

# Vote badges (display only). The highest tier a paper reaches is shown. Remove all to disable.
tiers:
  - {name: Bronze,   emoji: "🥉", min_upvotes: 50,  color: "#CD7F32"}
  - {name: Gold,     emoji: "🥇", min_upvotes: 100, color: "#D4AF37"}
  - {name: Platinum, emoji: "💎", min_upvotes: 200, color: "#7F9BB3"}

categories:
  - name: LLMs & Reasoning
    emoji: "🧠"
    description: Large language models, pretraining, reasoning, chain-of-thought, math and code generation. If the focus is an agent acting with tools, use Agents; if it is mainly training data or recipes, use Training & Data.
  - name: Agents
    emoji: "🤖"
    description: Software agents built on LLMs or VLMs acting in digital or virtual environments - tool use, planning, web/GUI/computer-use agents, video game agents, multi-agent systems. Agents that control physical robots go to Robotics & Embodied AI.
  - name: Multimodal / Vision-Language
    emoji: "🖼️"
    description: Models combining text with images or video for understanding (VLMs, visual QA, captioning, document understanding). Generating images or video goes to Image & Video Generation.
  - name: Computer Vision
    emoji: "👁️"
    description: Image and video understanding without a language focus - detection, segmentation, 3D reconstruction, depth, tracking. If text is central, use Multimodal / Vision-Language.
  - name: Image & Video Generation
    emoji: "🎨"
    description: Diffusion and other generative models - text-to-image, text-to-video, image/video editing, 3D and avatar generation.
  - name: Audio & Speech
    emoji: "🔊"
    description: Speech recognition, text-to-speech, voice, music and audio generation or understanding.
  - name: Robotics & Embodied AI
    emoji: "🦾"
    description: Physical robots and embodied agents in the real world (or robot simulators) - manipulation, locomotion, navigation, robot learning, vision-language-action models for robots. Includes LLM- or agent-based robots. Agents that play video games or act in virtual/software worlds are NOT robotics.
  - name: Efficiency & Inference
    emoji: "⚡"
    description: Making models cheaper or faster - quantization, distillation, pruning, sparse/MoE efficiency, serving, long-context efficiency, hardware.
  - name: Training & Data
    emoji: "📊"
    description: Datasets, data curation, synthetic data, fine-tuning methods, RL training recipes, optimizers, scaling laws.
  - name: Safety & Alignment
    emoji: "🛡️"
    description: Alignment, preference learning for safety, jailbreaks and red-teaming, interpretability, privacy, fairness, watermarking.
  - name: Benchmarks & Evaluation
    emoji: "📏"
    description: Papers whose main contribution is a new benchmark, evaluation method, or analysis of model capabilities. A model paper that also reports benchmarks belongs to the model's topic.
  - name: Other
    emoji: "📦"
    description: Anything that fits none of the categories above.
